services:
  # ==========================================
  # Backend Web Service (Node.js / Express API)
  # ==========================================
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate:up && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: HF_TOKEN
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: nexus-web
          property: host

  # ==========================================
  # Frontend Static Site (React 19 / Vite SPA)
  # ==========================================
  - type: web
    name: nexus-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexus-api-ullk.onrender.com/api/v1
